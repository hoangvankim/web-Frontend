<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực Hành: grid-gap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Thực Hành: Thuộc tính grid-gap trong CSS Grid</h1>

    <!-- Ví dụ 1 -->
    <div class="card">
        <h2>Ví dụ 1: Khoảng cách hàng và cột bằng nhau (grid-gap: 20px)</h2>
        <div class="grid-container grid-example1">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
        </div>
    </div>

    <!-- Ví dụ 2 -->
    <div class="card">
        <h2>Ví dụ 2: Khoảng cách hàng và cột khác nhau (grid-gap: 30px 10px)</h2>
        <div class="grid-container grid-example2">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
            <div>Ô 5</div>
            <div>Ô 6</div>
        </div>
    </div>
</body>
</html>
