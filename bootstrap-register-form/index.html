<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - Bootstrap Form</title>
    <!-- Nhúng Bootstrap 5.3.0 CSS từ CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #e0e7ff 0%, #f1f5f9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .form-card {
            background-color: #ffffff;
            border-radius: 16px;
            border: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            max-width: 650px;
            width: 100%;
        }
        .form-header {
            background: linear-gradient(135deg, #0d6efd, #0b5ed7);
            color: #ffffff;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            padding: 30px 20px;
        }
        .form-check-input:checked {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }
    </style>
</head>
<body>
    <div class="card form-card">
        <!-- Header của Form -->
        <div class="form-header text-center">
            <h2 class="fw-bold mb-1">Tạo Tài Khoản Mới</h2>
            <p class="mb-0 text-light opacity-75">Vui lòng điền đầy đủ thông tin vào biểu mẫu dưới đây</p>
        </div>

        <!-- Thân Form -->
        <div class="card-body p-4 p-md-5">
            <form action="#" method="POST" id="registerForm">
                <!-- 1. Họ và tên -->
                <div class="mb-3">
                    <label for="fullName" class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="fullName" placeholder="Ví dụ: Nguyễn Văn An" required>
                    <div class="form-text text-muted">Nhập họ và tên đầy đủ theo giấy tờ tùy thân.</div>
                </div>

                <!-- 2. Email -->
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Địa chỉ Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    <div class="form-text text-muted">Chúng tôi cam kết bảo mật tuyệt đối email của bạn.</div>
                </div>

                <!-- 3 & 4. Mật khẩu và Xác nhận mật khẩu (chia 2 cột) -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu..." required minlength="6">
                        <div class="form-text text-muted">Tối thiểu 6 ký tự.</div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="confirmPassword" class="form-label fw-semibold">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="confirmPassword" placeholder="Nhập lại mật khẩu..." required>
                    </div>
                </div>

                <!-- 5. Giới tính (Radio buttons) -->
                <div class="mb-3">
                    <label class="form-label fw-semibold d-block">Giới tính <span class="text-danger">*</span></label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male" checked>
                        <label class="form-check-label" for="genderMale">Nam</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female">
                        <label class="form-check-label" for="genderFemale">Nữ</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="genderOther" value="other">
                        <label class="form-check-label" for="genderOther">Khác</label>
                    </div>
                </div>

                <!-- 6. Sở thích (Checkboxes) -->
                <div class="mb-3">
                    <label class="form-label fw-semibold d-block">Sở thích</label>
                    <div class="row g-2">
                        <div class="col-6 col-sm-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="hobbyReading" value="reading" checked>
                                <label class="form-check-label" for="hobbyReading">Đọc sách</label>
                            </div>
                        </div>
                        <div class="col-6 col-sm-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="hobbySports" value="sports">
                                <label class="form-check-label" for="hobbySports">Thể thao</label>
                            </div>
                        </div>
                        <div class="col-6 col-sm-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="hobbyMusic" value="music" checked>
                                <label class="form-check-label" for="hobbyMusic">Âm nhạc</label>
                            </div>
                        </div>
                        <div class="col-6 col-sm-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="hobbyTravel" value="travel">
                                <label class="form-check-label" for="hobbyTravel">Du lịch</label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 7. Quốc gia (Dropdown Select) -->
                <div class="mb-4">
                    <label for="country" class="form-label fw-semibold">Quốc gia <span class="text-danger">*</span></label>
                    <select class="form-select" id="country" required>
                        <option value="" disabled>-- Chọn quốc gia của bạn --</option>
                        <option value="VN" selected>Việt Nam</option>
                        <option value="US">Hoa Kỳ (United States)</option>
                        <option value="JP">Nhật Bản (Japan)</option>
                        <option value="KR">Hàn Quốc (South Korea)</option>
                        <option value="SG">Singapore</option>
                        <option value="AU">Úc (Australia)</option>
                    </select>
                </div>

                <!-- Điều khoản sử dụng -->
                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="terms" required>
                    <label class="form-check-label text-muted small" for="terms">
                        Tôi đồng ý với các <a href="#" class="text-decoration-none text-primary">Điều khoản dịch vụ</a> và <a href="#" class="text-decoration-none text-primary">Chính sách bảo mật</a>.
                    </label>
                </div>

                <!-- 8. Nút Submit (btn-primary) -->
                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary btn-lg fw-bold shadow-sm">
                        Đăng Ký Tài Khoản
                    </button>
                </div>

                <!-- Chân biểu mẫu -->
                <p class="text-center text-muted small mb-0">
                    Đã có tài khoản? <a href="#" class="text-primary text-decoration-none fw-semibold">Đăng nhập ngay</a>
                </p>
            </form>
        </div>
    </div>

    <!-- Nhúng Bootstrap 5.3.0 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
