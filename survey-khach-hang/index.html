<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Market Research Survey</title>
    <style>
        body {
            font-family: "Lucida Grande", "Lucida Sans Unicode", Tahoma, sans-serif;
            background-color: #f6f7fb;
            margin: 0;
            padding: 30px 15px;
            color: #333333;
        }
        .survey-container {
            max-width: 650px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #dedede;
            border-radius: 4px;
            padding: 25px 35px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }
        header {
            border-bottom: 1px dotted #ccc;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h2 {
            margin: 0 0 6px 0;
            color: #111111;
            font-size: 22px;
        }
        .subtitle {
            font-size: 13px;
            color: #666666;
        }
        .form-item {
            margin-bottom: 22px;
        }
        .desc {
            display: block;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 8px;
            color: #222;
        }
        select, textarea {
            font-family: inherit;
            font-size: 13px;
            border: 1px solid #bbb;
            border-radius: 2px;
            padding: 6px 8px;
        }
        select {
            min-width: 200px;
        }
        textarea {
            width: 100%;
            box-sizing: border-box;
            resize: vertical;
        }
        .choice-list label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        .currency-input {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
        }
        .currency-input input {
            padding: 5px 8px;
            border: 1px solid #bbb;
            border-radius: 2px;
            font-size: 13px;
        }
        .price-sublabel {
            font-size: 11px;
            color: #777;
            display: block;
            margin-top: 2px;
        }
        .likert-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-top: 10px;
        }
        .likert-table th, .likert-table td {
            padding: 10px 8px;
            text-align: center;
            border-top: 1px solid #e0e0e0;
        }
        .likert-table th {
            text-align: left;
            font-weight: normal;
        }
        .likert-table thead td {
            font-weight: bold;
            color: #444;
            background-color: #fafafa;
        }
        .likert-table tbody tr:nth-child(even) {
            background-color: #fcfcfc;
        }
        .submit-btn {
            background-color: #007faa;
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 15px;
        }
        .submit-btn:hover {
            background-color: #006688;
        }
    </style>
</head>
<body>
    <div class="survey-container">
        <header>
            <h2>Market Research Survey</h2>
            <div class="subtitle">Please take a few moments to complete this satisfaction survey.</div>
        </header>

        <form action="" method="POST">
            <div class="form-item">
                <label class="desc">What is your age range?</label>
                <select name="age_range">
                    <option value="18-24">18-24</option>
                    <option value="25-34">25-34</option>
                    <option value="35-50">35-50</option>
                    <option value="50+">50+</option>
                </select>
            </div>

            <div class="form-item">
                <label class="desc">What is your yearly income range?</label>
                <select name="income_range">
                    <option value="$0 - $25,000">$0 - $25,000</option>
                    <option value="$25,001 - $50,000">$25,001 - $50,000</option>
                    <option value="$50,001 - $100,000">$50,001 - $100,000</option>
                    <option value="$100,000+">$100,000+</option>
                </select>
            </div>

            <div class="form-item">
                <label class="desc">Gender Identity</label>
                <div class="choice-list">
                    <label><input type="radio" name="gender" value="Male" checked /> Male</label>
                    <label><input type="radio" name="gender" value="Female" /> Female</label>
                    <label><input type="radio" name="gender" value="Nonbinary" /> Nonbinary</label>
                    <label>
                        <input type="radio" name="gender" value="Other" /> Other
                        <input type="text" name="gender_other" style="margin-left: 8px; padding: 4px; border: 1px solid #ccc;" />
                    </label>
                </div>
            </div>

            <div class="form-item">
                <label class="desc">Which of the following products have you purchased in the last 2 months. Please check all that apply.</label>
                <div class="choice-list">
                    <label><input type="checkbox" name="product" value="Product 1" /> Product 1</label>
                    <label><input type="checkbox" name="product" value="Product 2" /> Product 2</label>
                    <label><input type="checkbox" name="product" value="Product 3" /> Product 3</label>
                </div>
            </div>

            <div class="form-item">
                <label class="desc">How often would you use our new product?</label>
                <div class="choice-list">
                    <label><input type="radio" name="frequency" value="Daily" checked /> Daily</label>
                    <label><input type="radio" name="frequency" value="Weekly" /> Weekly</label>
                    <label><input type="radio" name="frequency" value="Monthly" /> Monthly</label>
                </div>
            </div>

            <div class="form-item">
                <label class="desc">What would you pay for the new product?</label>
                <div class="currency-input">
                    <span>$</span>
                    <div>
                        <input type="text" name="price_dollars" size="10" />
                        <span class="price-sublabel">Dollars</span>
                    </div>
                    <span>.</span>
                    <div>
                        <input type="text" name="price_cents" size="3" maxlength="2" />
                        <span class="price-sublabel">Cents</span>
                    </div>
                </div>
            </div>

            <div class="form-item">
                <label class="desc">What features would you like to see in the new product.</label>
                <textarea name="features" rows="6"></textarea>
            </div>

            <div class="form-item">
                <label class="desc">Please rate your level of agreement with the following statements.</label>
                <table class="likert-table">
                    <thead>
                        <tr>
                            <th>&nbsp;</th>
                            <td>Strongly Disagree</td>
                            <td>Disagree</td>
                            <td>Agree</td>
                            <td>Strongly Agree</td>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <th>Our products are priced fairly.</th>
                            <td><input type="radio" name="statement_1" value="1" /> 1</td>
                            <td><input type="radio" name="statement_1" value="2" /> 2</td>
                            <td><input type="radio" name="statement_1" value="3" /> 3</td>
                            <td><input type="radio" name="statement_1" value="4" /> 4</td>
                        </tr>
                        <tr>
                            <th>Our products are high quality.</th>
                            <td><input type="radio" name="statement_2" value="1" /> 1</td>
                            <td><input type="radio" name="statement_2" value="2" /> 2</td>
                            <td><input type="radio" name="statement_2" value="3" /> 3</td>
                            <td><input type="radio" name="statement_2" value="4" /> 4</td>
                        </tr>
                        <tr>
                            <th>You would recommend our product to a friend or coworker.</th>
                            <td><input type="radio" name="statement_3" value="1" /> 1</td>
                            <td><input type="radio" name="statement_3" value="2" /> 2</td>
                            <td><input type="radio" name="statement_3" value="3" /> 3</td>
                            <td><input type="radio" name="statement_3" value="4" /> 4</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div>
                <input type="submit" value="Submit" class="submit-btn" />
            </div>
        </form>
    </div>
</body>
</html>
