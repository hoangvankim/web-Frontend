<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xây dựng bố cục với Mô hình hộp CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Thực Hành: Mô Hình Hộp (Box Model) CSS</h1>
    <div class="container">
        <div class="card">
            <h3>Thẻ 1: content-box</h3>
            <p>box-sizing: content-box</p>
            <p>Tổng rộng = 280 + 40 + 10 = 330px</p>
        </div>
        <div class="card">
            <h3>Thẻ 2: border-box</h3>
            <p>box-sizing: border-box</p>
            <p>Tổng rộng giữ nguyên = 280px</p>
        </div>
        <div class="card">
            <h3>Thẻ 3: border-box</h3>
            <p>box-sizing: border-box</p>
            <p>Tổng rộng giữ nguyên = 280px</p>
        </div>
    </div>
</body>
</html>
