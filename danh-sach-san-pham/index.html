<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Danh sách sản phẩm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
        }
        h1 {
            color: #333;
        }
        table {
            width: 100%;
            max-width: 600px;
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }
        th, td {
            border: 1px solid #dddddd;
            padding: 12px 15px;
            text-align: left;
        }
        th {
            background-color: #1a73e8;
            color: #ffffff;
        }
        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        tr:hover {
            background-color: #f1f3f4;
        }
    </style>
</head>
<body>
    <h1>Danh sách sản phẩm</h1>
    <table>
        <thead>
            <tr>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Điện thoại iPhone 15 Pro Max</td>
                <td>29.990.000 đ</td>
                <td>15</td>
            </tr>
            <tr>
                <td>Laptop Dell XPS 13</td>
                <td>25.500.000 đ</td>
                <td>8</td>
            </tr>
            <tr>
                <td>Tai nghe Sony WH-1000XM5</td>
                <td>6.990.000 đ</td>
                <td>20</td>
            </tr>
            <tr>
                <td>Đồng hồ Apple Watch Series 9</td>
                <td>10.290.000 đ</td>
                <td>12</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
