<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Form Đăng Ký Người Dùng</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .form-container {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #34495e;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus {
            border-color: #3498db;
            outline: none;
        }
        .gender-group {
            display: flex;
            gap: 20px;
            margin-top: 6px;
        }
        .gender-group label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        input[type="submit"] {
            width: 100%;
            background-color: #3498db;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        input[type="submit"]:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Đăng Ký Người Dùng</h2>
        <form action="http://demo.codegym.vn/6/registration_form/register.php" method="POST">
            <div class="form-group">
                <label>Họ và tên:</label>
                <input type="text" name="name" placeholder="Nhập họ và tên..." required />
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" name="email" placeholder="example@email.com" required />
            </div>
            <div class="form-group">
                <label>Số điện thoại:</label>
                <input type="tel" name="phone" placeholder="0901234567" required />
            </div>
            <div class="form-group">
                <label>Giới tính:</label>
                <div class="gender-group">
                    <label><input type="radio" name="gender" value="male" checked /> Nam</label>
                    <label><input type="radio" name="gender" value="female" /> Nữ</label>
                </div>
            </div>
            <input type="submit" value="Đăng ký" />
        </form>
    </div>
</body>
</html>
