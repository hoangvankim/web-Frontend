<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Gộp ô trong bảng</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        table {
            border-collapse: collapse;
            width: 450px;
        }
        th, td {
            padding: 10px 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h2>Thời khóa biểu</h2>
    <table border="1">
        <tr>
            <th>Thứ</th>
            <th>Môn học</th>
            <th>Giáo viên</th>
        </tr>
        <tr>
            <td rowspan="2">Thứ Hai</td>
            <td>Toán</td>
            <td>Thầy Nam</td>
        </tr>
        <tr>
            <td>Văn</td>
            <td>Cô Hạnh</td>
        </tr>
        <tr>
            <td>Thứ Ba</td>
            <td colspan="2">Nghỉ học</td>
        </tr>
    </table>
</body>
</html>
